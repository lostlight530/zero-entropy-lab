name: GPT Native verify a2 contract 2026-11-09
on:
  push:
    branches:
      - gpt-native/aegis-a2-20261109
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify a2 native machine contract
        run: python3 aegis-cortex/check.py aegis-cortex/2026-11-09-A2-doctrine-orient.md
      - name: Verify clean worktree
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
