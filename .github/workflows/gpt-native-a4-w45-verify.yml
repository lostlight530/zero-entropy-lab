name: GPT Native W45 A4 contract
on:
  push:
    branches:
      - gpt-native/aegis-a4-2026w45
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Contract validation
        run: python3 aegis-cortex/check.py aegis-cortex/2026-W45-A4-protocol-act.md
      - name: No code write
        run: test -z "$(git status --porcelain)"
