name: GPT Native Nov10 Stage2 Contract Check (temporary)
on:
  push:
    branches:
      - gpt-native/aegis-a2-20261110
permissions:
  contents: read
jobs:
  stage2-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact proposed stage2 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gpt-native/aegis-a2-20261110
          persist-credentials: false
      - name: Run repository-owned stage2 contract
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 --version
          python3 aegis-cortex/check.py aegis-cortex/2026-11-10-A2-doctrine-orient.md
          test -z "$(git status --porcelain)"
